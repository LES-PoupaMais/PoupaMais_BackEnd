name: CI

on:
  push:
    branches: [development, main]
  pull_request:

# Um push novo no mesmo PR cancela a execução anterior
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  testes:
    name: Testes e cobertura
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Banco descartável para os testes de integração (cascata da exclusão de conta, CHECK de status,
    # FK DEFERRABLE, Specifications); mesma versão major do docker-compose.yml
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: poupamais_test
          POSTGRES_USER: poupamais
          POSTGRES_PASSWORD: poupamais
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U poupamais -d poupamais_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POUPAMAIS_TEST_DB_URL: jdbc:postgresql://localhost:5432/poupamais_test
      DB_USER: poupamais
      DB_PASSWORD: poupamais

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # O banco de serviço nasce vazio: o Flyway cria o schema ao subir o contexto dos testes

      - name: Formatação
        run: ./mvnw -B -ntp spotless:check

      # verify roda unitários, web, integração e ModularidadeTest, e falha se a cobertura (JaCoCo)
      # ficar abaixo do piso do pom.xml
      - name: Testes
        run: ./mvnw -B -ntp verify

      - name: Relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-backend
          path: target/site/jacoco/
          if-no-files-found: ignore

      - name: Relatório dos testes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes-backend
          path: target/surefire-reports/

  compose:
    name: Docker Compose
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Configuração do compose
        run: docker compose config -q
