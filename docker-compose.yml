# Ambiente local do PoupaMais (backend). O schema vem do Flyway (src/main/resources/db/migration).
#   docker compose up -d --build        -> tudo: db + mailpit + api (http://localhost:8080/swagger-ui.html)
#   docker compose up -d db mailpit     -> só a infra, para rodar a API com ./mvnw spring-boot:run
#   docker compose up -d db-test        -> banco vazio dos testes de integração (porta 5433)
#   docker compose down                 -> para tudo (mantém os dados)
#   docker compose down -v              -> para tudo e APAGA os dados (o Flyway recria o schema na próxima subida)
#   docker compose logs -f api          -> logs da API
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: poupamais
      POSTGRES_USER: ${DB_USER:-poupamais}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-poupamais}
    ports:
      - "5432:5432"
    volumes:
      - dados-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-poupamais} -d poupamais"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Banco dos testes de integração (POUPAMAIS_TEST_DB_URL); nasce vazio e sem volume: some no down
  db-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: poupamais_test
      POSTGRES_USER: poupamais
      POSTGRES_PASSWORD: poupamais
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poupamais -d poupamais_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Captura os e-mails enviados em desenvolvimento (interface em http://localhost:8025)
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  # API (Dockerfile). Usa o .env se existir; dentro do compose, banco e e-mail apontam para os serviços
  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      DB_URL: jdbc:postgresql://db:5432/poupamais
      DB_USER: ${DB_USER:-poupamais}
      DB_PASSWORD: ${DB_PASSWORD:-poupamais}
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-PoupaMais <nao-responda@poupamais.local>}
      JWT_SECRET: ${JWT_SECRET:-troque-este-segredo-de-desenvolvimento-por-um-valor-longo-e-aleatorio}
      JWT_EXPIRACAO_MIN: ${JWT_EXPIRACAO_MIN:-480}
      FRONT_URL: ${FRONT_URL:-http://localhost:3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      SWAGGER_HABILITADO: ${SWAGGER_HABILITADO:-true}
    ports:
      - "8080:8080"

volumes:
  dados-db:
