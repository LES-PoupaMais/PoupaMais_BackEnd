# Só para os testes (soma-se ao application.yml de src/main; não o substitui).
# Cada *IntegracaoTest com @DynamicPropertySource próprio sobe um contexto Spring separado, e todos ficam em cache até
# o fim do verify. Com o pool padrão (10 conexões) eram ~80 conexões abertas, e duas pipelines em paralelo no db-test
# compartilhado estouravam o max_connections=100 do Postgres ("too many clients"). Pendência 14 do plano.
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=10000
