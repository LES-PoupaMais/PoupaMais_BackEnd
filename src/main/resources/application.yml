# Valores padrão servem para desenvolvimento; em produção, defina as variáveis de ambiente (ver .env.example).
spring:
  application:
    name: poupamais-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/poupamais}
    username: ${DB_USER:poupamais}
    password: ${DB_PASSWORD:poupamais}

  jpa:
    open-in-view: false
    hibernate:
      # O schema vem das migrações do Flyway (db/migration); o Hibernate só confere
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: poupamais

  # Flyway cria o schema poupamais e aplica db/migration ao subir (histórico em poupamais.flyway_schema_history)
  flyway:
    schemas: poupamais
    default-schema: poupamais
    create-schemas: true

  servlet:
    multipart:
      # RN012 (CSV) e RN015 (foto de perfil): no máximo 2 MB
      max-file-size: 2MB
      max-request-size: 3MB

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}

poupamais:
  jwt:
    segredo: ${JWT_SECRET:troque-este-segredo-de-desenvolvimento-por-um-valor-longo-e-aleatorio}
    expiracao-min: ${JWT_EXPIRACAO_MIN:480}
  mail:
    remetente: ${MAIL_FROM:PoupaMais <nao-responda@poupamais.local>}
  front-url: ${FRONT_URL:http://localhost:3000}
  cors-origins: ${CORS_ORIGINS:http://localhost:3000}
  # Swagger/OpenAPI: true em dev, false em produção (desliga o springdoc e tira as rotas da lista pública)
  swagger-habilitado: ${SWAGGER_HABILITADO:true}

springdoc:
  api-docs:
    enabled: ${poupamais.swagger-habilitado}
  swagger-ui:
    enabled: ${poupamais.swagger-habilitado}
    path: /swagger-ui.html
